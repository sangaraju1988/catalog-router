[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-router"
version = "0.1.1"
description = "MCP server that routes BI questions to the right system (dbt, Looker, Tableau, Superset, BigQuery) using a semantic catalog graph."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
catalog-router = "catalog_router.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
